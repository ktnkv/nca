[project]
name = "neural-ca"
version = "0.1.1"
description = "Neural cellular automata on PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxim Koltugin" }]
keywords = ["cellular-automata", "neural-cellular-automata", "pytorch", "nca"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["torch>=2.2"]

[project.urls]
Repository = "https://github.com/mkotenkov/nca"

[tool.uv.build-backend]
module-name = "nca"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "numpy"]
